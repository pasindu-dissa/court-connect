<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourtConnect - Super Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.1), transparent 40%);
        }

        /* Glassmorphism Classes */
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        /* Header */
        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Containers */
        .container {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
        }

        /* Login Screen */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 80px); /* subtract header height */
        }

        .login-card {
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .login-card h2 {
            margin-bottom: 24px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-main);
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
            filter: brightness(1.1);
        }

        /* Dashboard Screen */
        #dashboard-screen {
            display: none;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .dashboard-header h1 {
            font-size: 2rem;
            font-weight: 600;
        }

        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-card .value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(0, 0, 0, 0.3);
            padding: 16px 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-name {
            font-weight: 500;
        }

        .user-email {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.player {
            background: rgba(94, 234, 212, 0.1);
            color: #5eead4;
            border: 1px solid rgba(94, 234, 212, 0.2);
        }

        .badge.court_owner {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .badge.admin {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        select.role-select {
            background: rgba(0, 0, 0, 0.5);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        select.role-select:focus {
            border-color: var(--primary);
        }

        select.role-select option {
            background: var(--bg-color);
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* Notifications */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        .toast.success {
            border-left-color: var(--success);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">CourtConnect Admin</div>
        <button id="logout-btn" class="action-btn" style="display: none;" onclick="logout()">Logout</button>
    </header>

    <!-- Login Screen -->
    <div id="login-screen" class="container">
        <div class="glass login-card">
            <h2>Super Admin Access</h2>
            <form id="login-form">
                <div class="input-group">
                    <label for="admin-key">Developer Key</label>
                    <input type="password" id="admin-key" placeholder="Enter super admin password" required>
                </div>
                <button type="submit" class="btn">Authenticate</button>
            </form>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="container">
        <div class="dashboard-header">
            <h1>User Management</h1>
            <button class="action-btn" onclick="fetchUsers()">Refresh Data</button>
        </div>

        <div class="stats-row">
            <div class="glass stat-card">
                <span class="label">Total Users</span>
                <span class="value" id="stat-total">0</span>
            </div>
            <div class="glass stat-card">
                <span class="label">Players</span>
                <span class="value" id="stat-players">0</span>
            </div>
            <div class="glass stat-card">
                <span class="label">Court Owners</span>
                <span class="value" id="stat-owners">0</span>
            </div>
        </div>

        <div class="glass table-container">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Joined Date</th>
                        <th>Current Role</th>
                        <th>Change Role</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <!-- Rows will be populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Notification Message</div>

    <script>
        const API_URL = '/api/admin';
        let adminKey = localStorage.getItem('court_connect_super_admin_key');

        // DOM Elements
        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const loginForm = document.getElementById('login-form');
        const headerLogoutBtn = document.getElementById('logout-btn');
        const usersTableBody = document.getElementById('users-table-body');
        const toast = document.getElementById('toast');

        // Init Check
        if (adminKey) {
            verifyKey();
        }

        // Event Listeners
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const key = document.getElementById('admin-key').value;
            // Attempt to verify key
            try {
                const res = await fetch(`${API_URL}/auth`, {
                    method: 'POST',
                    headers: {
                        'x-super-admin-key': key
                    }
                });
                if (res.ok) {
                    adminKey = key;
                    localStorage.setItem('court_connect_super_admin_key', key);
                    showToast('Authentication successful', 'success');
                    showDashboard();
                } else {
                    showToast('Invalid Developer Key', 'error');
                }
            } catch (err) {
                showToast('Connection error', 'error');
            }
        });

        async function verifyKey() {
            try {
                const res = await fetch(`${API_URL}/auth`, {
                    method: 'POST',
                    headers: { 'x-super-admin-key': adminKey }
                });
                if (res.ok) {
                    showDashboard();
                } else {
                    logout();
                }
            } catch (err) {
                console.error(err);
            }
        }

        function showDashboard() {
            loginScreen.style.display = 'none';
            dashboardScreen.style.display = 'block';
            headerLogoutBtn.style.display = 'block';
            fetchUsers();
        }

        function logout() {
            localStorage.removeItem('court_connect_super_admin_key');
            adminKey = null;
            loginScreen.style.display = 'flex';
            dashboardScreen.style.display = 'none';
            headerLogoutBtn.style.display = 'none';
            document.getElementById('admin-key').value = '';
        }

        async function fetchUsers() {
            try {
                const res = await fetch(`${API_URL}/users`, {
                    headers: { 'x-super-admin-key': adminKey }
                });
                
                if (res.status === 401) { logout(); return; }
                
                const users = await res.json();
                renderUsers(users);
                updateStats(users);
            } catch (err) {
                showToast('Failed to fetch users', 'error');
            }
        }

        function updateStats(users) {
            document.getElementById('stat-total').innerText = users.length;
            document.getElementById('stat-players').innerText = users.filter(u => u.role === 'player').length;
            document.getElementById('stat-owners').innerText = users.filter(u => u.role === 'court_owner').length;
        }

        function renderUsers(users) {
            usersTableBody.innerHTML = '';
            
            users.forEach(user => {
                const date = new Date(user.createdAt).toLocaleDateString();
                const isSystemAdmin = user.role === 'admin';
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="user-info">
                            <span class="user-name">${escapeHtml(user.name)}</span>
                            <span class="user-email">${escapeHtml(user.email)}</span>
                        </div>
                    </td>
                    <td style="color: var(--text-muted); font-size: 0.9rem;">${date}</td>
                    <td>
                        <span class="badge ${user.role}" id="badge-${user._id}">${user.role.replace('_', ' ')}</span>
                    </td>
                    <td>
                        <select class="role-select" id="select-${user._id}" ${isSystemAdmin ? 'disabled' : ''}>
                            <option value="player" ${user.role === 'player' ? 'selected' : ''}>Player</option>
                            <option value="court_owner" ${user.role === 'court_owner' ? 'selected' : ''}>Court Owner</option>
                        </select>
                    </td>
                    <td>
                        <button class="action-btn" onclick="updateRole('${user._id}')" ${isSystemAdmin ? 'disabled' : ''}>Save</button>
                    </td>
                `;
                usersTableBody.appendChild(tr);
            });
        }

        async function updateRole(userId) {
            const select = document.getElementById(`select-${userId}`);
            const newRole = select.value;

            try {
                const res = await fetch(`${API_URL}/users/${userId}/role`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-super-admin-key': adminKey 
                    },
                    body: JSON.stringify({ role: newRole })
                });

                const data = await res.json();

                if (res.ok) {
                    showToast('Role updated successfully', 'success');
                    // Update the badge UI to reflect the new state instantly
                    const badge = document.getElementById(`badge-${userId}`);
                    badge.className = `badge ${newRole}`;
                    badge.innerText = newRole.replace('_', ' ');
                    
                    // Refresh stats passively
                    setTimeout(() => fetchUsers(), 500); 
                } else {
                    showToast(data.message || 'Error updating role', 'error');
                }

            } catch (err) {
                showToast('Failed to connect to server', 'error');
            }
        }

        function showToast(message, type = 'success') {
            toast.innerText = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Utility to prevent XSS
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
